<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter, Segoe UI, SF Pro Display, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="cbg" cx="0.5" cy="0.2" r="1">
      <stop offset="0" stop-color="#121b32"/>
      <stop offset="0.6" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="cvig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="cedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e6b34d"/>
    </linearGradient>
    <pattern id="cdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#202b45"/>
    </pattern>
    <filter id="cblur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#8f8ff2" stroke-width="1.6"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#5b6b85" stroke-width="1.6"/>
    </marker>
    <!-- ======== icon set: 24x24, stroke=currentColor, fill=none ======== -->
    <symbol id="i-term" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="15" rx="2.5"/><path d="M6.5,9.5 l3,3 -3,3 M12,15.5 h5.5"/>
    </symbol>
    <symbol id="i-box" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,2.5 l8,4.6 v9.2 l-8,4.6 -8,-4.6 v-9.2 z"/><path d="M4.5,7.3 l7.5,4.3 7.5,-4.3 M12,11.6 v8.7"/>
    </symbol>
    <symbol id="i-hex" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,2.5 l7.8,4.5 v9 l-7.8,4.5 -7.8,-4.5 v-9 z"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-layers" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,3.5 l8.5,4.7 -8.5,4.7 -8.5,-4.7 z"/><path d="M4.5,12.5 l7.5,4.1 7.5,-4.1 M4.5,16.5 l7.5,4.1 7.5,-4.1"/>
    </symbol>
    <symbol id="i-bolt" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13,2.5 l-6.5,9.5 h5 l-1.5,9.5 7,-10 h-5.5 z"/>
    </symbol>
    <symbol id="i-link" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="6" cy="12" r="3.2"/><circle cx="18" cy="12" r="3.2"/><line x1="9.2" y1="12" x2="14.8" y2="12"/>
    </symbol>
    <symbol id="i-eye" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5,12 c2.5,-4.5 6,-7 9.5,-7 s7,2.5 9.5,7 c-2.5,4.5 -6,7 -9.5,7 s-7,-2.5 -9.5,-7 z"/><circle cx="12" cy="12" r="2.4"/>
    </symbol>
    <symbol id="i-sliders" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="5" y1="4" x2="5" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="19" y1="4" x2="19" y2="20"/>
      <circle cx="5" cy="9" r="2.2" fill="#0b0f1a"/><circle cx="12" cy="15" r="2.2" fill="#0b0f1a"/><circle cx="19" cy="8" r="2.2" fill="#0b0f1a"/>
    </symbol>
    <symbol id="i-chip" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/><path d="M9,2.5 v4 M15,2.5 v4 M9,17.5 v4 M15,17.5 v4 M2.5,9 h4 M2.5,15 h4 M17.5,9 h4 M17.5,15 h4"/>
    </symbol>
    <symbol id="i-globe" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M3,12 h18 M12,3 c-4.5,4.5 -4.5,13.5 0,18 M12,3 c4.5,4.5 4.5,13.5 0,18"/>
    </symbol>
    <symbol id="i-branch" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="6.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="9.5" r="2.5"/>
      <path d="M6.5,8 v8 M17.5,12 c0,3.5 -4,3 -8,4.5"/>
    </symbol>
    <symbol id="i-search" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/>
    </symbol>
    <symbol id="i-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M8,12.5 l2.8,2.8 5.2,-6"/>
    </symbol>
    <symbol id="i-doc" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6,2.5 h8 l4,4 v15 h-12 z"/><path d="M14,2.5 v4 h4 M9,12 h6 M9,15.5 h6"/>
    </symbol>
    <symbol id="i-play" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M10,8.5 l6,3.5 -6,3.5 z" fill="currentColor" stroke="none"/>
    </symbol>
