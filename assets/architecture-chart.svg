    <use href="#i-check" xlink:href="#i-check" x="58" y="412" width="18" height="18" color="#34d399"/>
    <text x="82" y="426" fill="#6E7681" font-size="10">9 tests · zero deps*</text>
    <text x="60" y="448" fill="#475569" font-size="9.5">* +sysinfo for sys</text>
  </g>
  <!-- rplkit-runtime -->
