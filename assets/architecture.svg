<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Inter, Segoe UI, SF Pro Display, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#131c33"/>
      <stop offset="0.55" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#b9b9f5"/>
      <stop offset="1" stop-color="#f8fafc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1.2 0" to="1.2 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#202b45"/>
    </pattern>
    <!-- icon set: 24x24, stroke=currentColor -->
    <symbol id="h-chip" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/><path d="M9,2.5 v4 M15,2.5 v4 M9,17.5 v4 M15,17.5 v4 M2.5,9 h4 M2.5,15 h4 M17.5,9 h4 M17.5,15 h4"/>
    </symbol>
    <symbol id="h-box" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,2.5 l8,4.6 v9.2 l-8,4.6 -8,-4.6 v-9.2 z"/><path d="M4.5,7.3 l7.5,4.3 7.5,-4.3 M12,11.6 v8.7"/>
    </symbol>
    <symbol id="h-play" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M10,8.5 l6,3.5 -6,3.5 z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="h-layers" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,3.5 l8.5,4.7 -8.5,4.7 -8.5,-4.7 z"/><path d="M4.5,12.5 l7.5,4.1 7.5,-4.1 M4.5,16.5 l7.5,4.1 7.5,-4.1"/>
    </symbol>
    <symbol id="h-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M8,12.5 l2.8,2.8 5.2,-6"/>
    </symbol>
  </defs>

  <!-- backdrop -->
  <rect x="4" y="4" width="892" height="512" rx="22" fill="url(#bgGlow)" stroke="#26334d" stroke-width="1.5"/>
  <rect x="4" y="4" width="892" height="512" rx="22" fill="url(#dots)" opacity="0.45"/>
  <circle cx="450" cy="240" r="180" fill="#5B5BD6" opacity="0.07">
    <animate attributeName="opacity" values="0.07;0.11;0.07" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="4" y="4" width="892" height="512" rx="22" fill="url(#vignette)"/>

  <!-- header -->
  <text x="450" y="34" text-anchor="middle" fill="#5b6b85" font-size="10.5" letter-spacing="5" opacity="0">RPLKIT &#183; TERMINAL WORKSPACE
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
  </text>
  <text x="450" y="58" text-anchor="middle" fill="url(#sheen)" font-size="25" font-weight="800" letter-spacing="0.5" opacity="0">RPLKit Developer Tools
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.15s" fill="freeze"/>
  </text>
  <text x="450" y="78" text-anchor="middle" fill="#7d8aa0" font-size="10.5" letter-spacing="4" opacity="0">MONOCHROME &#8226; ONE IRIS ACCENT &#8226; CLI + TUI
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.35s" fill="freeze"/>
  </text>

  <!-- terminal -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.5s" fill="freeze"/>
    <rect x="180" y="96" width="540" height="264" rx="14" fill="#070b13" fill-opacity="0.97" stroke="#2A3342" stroke-width="1.5"/>
    <circle cx="202" cy="114" r="4.5" fill="#3a4356"/>
    <circle cx="218" cy="114" r="4.5" fill="#3a4356"/>
    <circle cx="234" cy="114" r="4.5" fill="#3a4356"/>
    <text x="450" y="118" text-anchor="middle" fill="#5b6b85" font-size="11" letter-spacing="2">rplkit</text>
    <circle cx="686" cy="114" r="4" fill="#5B5BD6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="698" y="118" fill="#8f8ff2" font-size="10" font-weight="700" letter-spacing="1">LIVE</text>
    <g font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text x="200" y="146" fill="#f1f5f9" font-weight="700">RPLKIT   <tspan fill="#8f8ff2">v0.3.0  ● READY</tspan></text>
      <text x="200" y="162" fill="#6E7681" font-size="10.5">Developer Toolkit</text>
      <use href="#h-chip" x="200" y="174" width="13" height="13" color="#6E7681"/>
      <text x="220" y="186" fill="#6E7681" font-size="10.5">OVERVIEW ─────────────────────</text>
      <text x="200" y="206" fill="#C9D1D9">CPU     18%  <tspan fill="#5B5BD6">███░░░░░░░░░</tspan></text>
      <text x="200" y="224" fill="#C9D1D9">Memory  42%  <tspan fill="#5B5BD6">█████░░░░░░░</tspan></text>
      <text x="200" y="242" fill="#C9D1D9">Disk    61%  <tspan fill="#5B5BD6">███████░░░░░</tspan></text>
      <use href="#h-box" x="200" y="254" width="13" height="13" color="#6E7681"/>
      <text x="220" y="266" fill="#6E7681" font-size="10.5">MODULES ──────────────────────</text>
      <rect x="194" y="274" width="512" height="19" fill="#5B5BD6" opacity="0.28">
        <animate attributeName="opacity" values="0.28;0.42;0.28" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="200" y="288" fill="#ffffff">▶ ● system-tools     Rust          enabled</text>
      <text x="200" y="306" fill="#C9D1D9">  ● git-tools        mixed         enabled</text>
      <text x="200" y="324" fill="#6E7681">  ○ school-tools     python        disabled</text>
      <text x="200" y="348" fill="#6E7681" font-size="10.5">[1] Tools   [2] Modules   [3] Logs   [?] Help   [q]</text>
    </g>
  </g>

  <!-- chain + stats + quote -->
  <text x="450" y="398" text-anchor="middle" fill="#6E7681" font-size="11.5" opacity="0">native &#160;<tspan fill="#5B5BD6">›</tspan>&#160; <tspan fill="#C9D1D9">embed</tspan> &#160;<tspan fill="#5B5BD6">›</tspan>&#160; <tspan fill="#C9D1D9">fallback</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.1s" fill="freeze"/>
  </text>
  <g font-size="10.5" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.3s" fill="freeze"/>
    <rect x="270" y="408" width="110" height="24" rx="12" fill="#0f1626" stroke="#2A3342"/>
    <use href="#h-box" x="280" y="413" width="14" height="14" color="#8f8ff2"/>
    <text x="333" y="424" fill="#C9D1D9">18 tools</text>
    <rect x="390" y="408" width="120" height="24" rx="12" fill="#0f1626" stroke="#2A3342"/>
    <use href="#h-layers" x="400" y="413" width="14" height="14" color="#8f8ff2"/>
    <text x="458" y="424" fill="#C9D1D9">5 modules</text>
    <rect x="520" y="408" width="110" height="24" rx="12" fill="#0f1626" stroke="#2A3342"/>
    <use href="#h-play" x="530" y="413" width="14" height="14" color="#8f8ff2"/>
    <text x="583" y="424" fill="#C9D1D9">CLI+TUI</text>
  </g>
  <text x="450" y="462" text-anchor="middle" fill="#94a3b8" font-size="13" font-style="italic" opacity="0">&#8220;Keep the core stable. Keep the tools replaceable.&#8221;
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.5s" fill="freeze"/>
  </text>
  <text x="450" y="486" text-anchor="middle" fill="#475569" font-size="10" letter-spacing="2" opacity="0">RATATUI · BLUE IRIS #5B5BD6
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.7s" fill="freeze"/>
  </text>
</svg>
