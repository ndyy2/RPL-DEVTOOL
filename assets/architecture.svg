<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" font-family="Segoe UI, Inter, SF Pro Display, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a44"/>
      <stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="sysGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12241c"/>
      <stop offset="1" stop-color="#0f1e28"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="4" y="4" width="852" height="572" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- title -->
  <text x="430" y="44" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700" opacity="0">RPLKit Developer Tools
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
  </text>
  <text x="430" y="64" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="3" opacity="0">CORE &#8226; SYSTEM MODULE &#8226; TOOLS
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.25s" fill="freeze"/>
  </text>

  <!-- ============ CORE ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
    <rect x="230" y="82" width="400" height="98" rx="14" fill="#1f6feb" opacity="0.28" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.28;0.55;0.28" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="82" width="400" height="98" rx="14" fill="url(#coreGrad)" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="430" y="108" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="700">CORE SYSTEM</text>
    <text x="430" y="126" text-anchor="middle" fill="#8b949e" font-size="11">runtime &#8226; module manager &#8226; system services</text>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <rect x="300" y="138" width="110" height="28" rx="14" fill="#659ad2" opacity="0.9"/>
      <text x="355" y="157" fill="#0b1a33">C++</text>
      <rect x="450" y="138" width="110" height="28" rx="14" fill="#dea584" opacity="0.9"/>
      <text x="505" y="157" fill="#3a130a">Rust</text>
    </g>
  </g>

  <!-- flow: core -> system -->
  <line x1="430" y1="182" x2="430" y2="212" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <polygon points="430,220 423,209 437,209" fill="#3fb950"/>
  <text x="452" y="204" fill="#3fb950" font-size="11" font-style="italic">discovers &#8226; dispatches</text>

  <!-- ============ SYSTEM MODULE ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
    <rect x="130" y="224" width="600" height="118" rx="14" fill="url(#sysGrad)" stroke="#3fb950" stroke-width="1.5"/>
    <text x="430" y="250" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="700">SYSTEM MODULE</text>
    <g font-size="12" font-weight="600" text-anchor="middle">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
        <rect x="152" y="262" width="176" height="58" rx="10" fill="#0d419d" stroke="#1f6feb"/>
        <text x="240" y="285" fill="#dbeafe">Python Runtime</text>
        <text x="240" y="303" fill="#93c5fd" font-size="10" font-weight="400">tools/python/ &#215;8</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
        <rect x="342" y="262" width="176" height="58" rx="10" fill="#0b3b2e" stroke="#3fb950"/>
        <text x="430" y="285" fill="#d1fae5">TypeScript Runtime</text>
        <text x="430" y="303" fill="#6ee7b7" font-size="10" font-weight="400">node &#8226; hello.ts</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
        <rect x="532" y="262" width="176" height="58" rx="10" fill="#3b2f0b" stroke="#d29922"/>
        <text x="620" y="285" fill="#fef3c7">Module Interface</text>
        <text x="620" y="303" fill="#fcd34d" font-size="10" font-weight="400">ToolMeta + manifest</text>
      </g>
    </g>
  </g>

  <!-- flows: system -> tools -->
  <g stroke-width="2.5" stroke-dasharray="7 7">
    <line x1="240" y1="344" x2="240" y2="376" stroke="#1f6feb">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="430" y1="344" x2="430" y2="376" stroke="#3fb950">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" begin="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="620" y1="344" x2="620" y2="376" stroke="#d29922">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#8b949e">
    <polygon points="240,384 233,373 247,373"/>
    <polygon points="430,384 423,373 437,373"/>
    <polygon points="620,384 613,373 627,373"/>
  </g>

  <!-- ============ TOOLS ============ -->
  <g font-size="12" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.7s" fill="freeze"/>
      <rect x="90" y="388" width="300" height="112" rx="12" fill="#111c33" stroke="#1f6feb" stroke-width="1.5"/>
      <text x="240" y="412" fill="#f0f6fc" font-size="14" font-weight="700">Python Tools</text>
      <text x="240" y="432" fill="#93c5fd" font-size="11">calculator &#8226; converter &#8226; encoder</text>
      <text x="240" y="448" fill="#93c5fd" font-size="11">json &#8226; uuid &#8226; timestamp &#8226; qr &#8226; file</text>
      <text x="240" y="470" fill="#f0f6fc" font-size="11" font-weight="700">8 tools
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </text>
      <text x="240" y="488" fill="#6e7681" font-size="10">stdlib-only &#8226; 13 tests OK</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.9s" fill="freeze"/>
      <rect x="410" y="388" width="150" height="112" rx="12" fill="#0d1f16" stroke="#3fb950" stroke-width="1.5"/>
      <text x="485" y="412" fill="#f0f6fc" font-size="14" font-weight="700">TS Tools</text>
      <text x="485" y="436" fill="#6ee7b7" font-size="11">hello.ts</text>
      <text x="485" y="454" fill="#6ee7b7" font-size="11">via node</text>
      <text x="485" y="480" fill="#6e7681" font-size="10">+ manifest</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.1s" fill="freeze"/>
      <rect x="580" y="388" width="190" height="112" rx="12" fill="#241d08" stroke="#d29922" stroke-width="1.5"/>
      <text x="675" y="412" fill="#f0f6fc" font-size="14" font-weight="700">Native Builtins</text>
      <text x="675" y="432" fill="#fcd34d" font-size="11">calc &#8226; b64 &#8226; hex &#8226; uuid</text>
      <text x="675" y="448" fill="#fcd34d" font-size="11">timestamp &#8226; file-info</text>
      <text x="675" y="470" fill="#f0f6fc" font-size="11" font-weight="700">C++ &#215; Rust
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </text>
      <text x="675" y="488" fill="#6e7681" font-size="10">5 Rust tests OK</text>
    </g>
  </g>

  <!-- footer -->
  <text x="430" y="536" text-anchor="middle" fill="#8b949e" font-size="13" font-style="italic" opacity="0">&#8220;Keep the core stable. Keep the tools replaceable.&#8221;
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.4s" fill="freeze"/>
  </text>
  <text x="430" y="558" text-anchor="middle" fill="#484f58" font-size="11" opacity="0">python3 main.py &#8226; build/cpp/rplkit &#8226; cargo build --manifest-path core/rust/Cargo.toml
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.7s" fill="freeze"/>
  </text>
</svg>
