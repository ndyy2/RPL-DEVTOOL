    <rect x="370" y="206" width="460" height="296" rx="14" fill="#0b1226" fill-opacity="0.94" stroke="url(#cedge)" stroke-width="1.6"/>
    <use href="#i-bolt" xlink:href="#i-bolt" x="388" y="218" width="22" height="22" color="#e6b34d"/>
    <text x="418" y="235" fill="#f1f5f9" font-size="13" font-weight="700">rplkit-runtime <tspan fill="#8f8ff2" font-size="10">★ runner</tspan></text>
    <text x="390" y="256" fill="#5b6b85" font-size="10.5">registry · chain · executors · FFI · history</text>
    <g font-size="10.5" text-anchor="middle" font-weight="600">
      <rect x="386" y="266" width="100" height="52" rx="9" fill="#0c1a3a" stroke="#38bdf8"/>
      <text x="436" y="287" fill="#bae6fd">registry</text>
      <text x="436" y="303" fill="#475569" font-size="9" font-weight="400">tool.json</text>
      <rect x="496" y="266" width="100" height="52" rx="9" fill="#0c1a3a" stroke="#38bdf8"/>
      <text x="546" y="287" fill="#bae6fd">chain</text>
      <text x="546" y="303" fill="#475569" font-size="9" font-weight="400">fallback</text>
      <rect x="606" y="266" width="100" height="52" rx="9" fill="#221a09" stroke="#e6b34d"/>
      <text x="656" y="287" fill="#fde68a">modules</text>
      <text x="656" y="303" fill="#475569" font-size="9" font-weight="400">overlay</text>
      <rect x="716" y="266" width="98" height="52" rx="9" fill="#0a1f1a" stroke="#34d399"/>
      <text x="765" y="287" fill="#a7f3d0">history</text>
      <text x="765" y="303" fill="#475569" font-size="9" font-weight="400">recent</text>
    </g>
    <g font-size="10.5" text-anchor="middle" font-weight="600">
      <rect x="386" y="328" width="214" height="52" rx="9" fill="#0a1410" stroke="#34d399"/>
      <text x="493" y="349" fill="#a7f3d0">exec_native · 14 ops</text>
      <text x="493" y="365" fill="#475569" font-size="9" font-weight="400">calc codec sys…</text>
      <rect x="610" y="328" width="204" height="52" rx="9" fill="#0a1410" stroke="#34d399"/>
      <text x="712" y="349" fill="#a7f3d0">exec_py · PyO3</text>
      <text x="712" y="365" fill="#475569" font-size="9" font-weight="400">embed → py-sys</text>
      <rect x="386" y="390" width="214" height="52" rx="9" fill="#0a1410" stroke="#34d399"/>
      <text x="493" y="411" fill="#a7f3d0">exec_js · swc+QJS</text>
      <text x="493" y="427" fill="#475569" font-size="9" font-weight="400">strip → node</text>
      <rect x="610" y="390" width="204" height="52" rx="9" fill="#0f1626" stroke="#5b6b85"/>
      <text x="712" y="411" fill="#C9D1D9">ffi · 46 tests</text>
      <text x="712" y="427" fill="#475569" font-size="9" font-weight="400">C strings + JSON</text>
    </g>
    <text x="390" y="470" fill="#475569" font-size="10">staticlib → C++ · rlib → tui</text>
  </g>
  <!-- rplkit-tui -->
  <g>
    <rect x="860" y="206" width="300" height="296" rx="14" fill="#0d0f1c" fill-opacity="0.94" stroke="#5B5BD6" stroke-width="1.6"/>
    <use href="#i-term" xlink:href="#i-term" x="878" y="218" width="22" height="22" color="#8f8ff2"/>
    <text x="908" y="235" fill="#f1f5f9" font-size="13" font-weight="700">rplkit-tui</text>
    <text x="880" y="256" fill="#5b6b85" font-size="10.5">ratatui · mono + iris</text>
    <g font-size="11" fill="#b9b9f5">
      <text x="880" y="284">theme (tokens)</text>
      <text x="880" y="306">app (state machine)</text>
      <text x="880" y="328">views ×7 + palette</text>
      <text x="880" y="350">history · OSC52</text>
      <text x="880" y="372">TestBackend goldens</text>
    </g>
    <use href="#i-check" xlink:href="#i-check" x="878" y="412" width="18" height="18" color="#34d399"/>
    <text x="902" y="426" fill="#6E7681" font-size="10">15 tests · tty-gated</text>
    <text x="880" y="450" fill="#475569" font-size="9.5">pipe → help, never hangs</text>
  </g>

  <!-- runtime <-> core/tui links -->
  <line x1="368" y1="350" x2="342" y2="350" stroke="#8f8ff2" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="7 6">
    <animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
  </line>
  <text x="355" y="338" text-anchor="middle" fill="#8f8ff2" font-size="10.5" font-style="italic">uses</text>
  <line x1="832" y1="350" x2="858" y2="350" stroke="#8f8ff2" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="7 6">
    <animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
  </line>
  <text x="845" y="363" text-anchor="middle" fill="#8f8ff2" font-size="10.5" font-style="italic">calls</text>

  <!-- ============ ROW 3: DATA ============ -->
  <g font-size="11">
    <g>
      <rect x="40" y="540" width="250" height="96" rx="12" fill="#0b1428" stroke="#38bdf8" stroke-width="1.3"/>
      <use href="#i-box" xlink:href="#i-box" x="56" y="552" width="20" height="20" color="#38bdf8"/>
      <text x="84" y="567" fill="#f1f5f9" font-weight="700" font-size="12">tools/calculator/</text>
      <text x="58" y="590" fill="#7d8aa0">tool.json · impl.py</text>
      <text x="58" y="610" fill="#7dd3fc" font-family="JetBrains Mono, Menlo, Consolas, monospace">exec: native · py</text>
    </g>
    <g>
      <rect x="310" y="540" width="250" height="96" rx="12" fill="#0a1a14" stroke="#34d399" stroke-width="1.3"/>
      <use href="#i-chip" xlink:href="#i-chip" x="326" y="552" width="20" height="20" color="#34d399"/>
      <text x="354" y="567" fill="#f1f5f9" font-weight="700" font-size="12">tools/system-info/</text>
      <text x="328" y="590" fill="#7d8aa0">tool.json · op: sysinfo</text>
      <text x="328" y="610" fill="#6ee7b7" font-family="JetBrains Mono, Menlo, Consolas, monospace">exec: native</text>
    </g>
    <g>
      <rect x="580" y="540" width="250" height="96" rx="12" fill="#221a09" stroke="#e6b34d" stroke-width="1.3"/>
      <use href="#i-doc" xlink:href="#i-doc" x="596" y="552" width="20" height="20" color="#e6b34d"/>
      <text x="624" y="567" fill="#f1f5f9" font-weight="700" font-size="12">tools/hello/</text>
      <text x="598" y="590" fill="#7d8aa0">tool.json · impl.ts</text>
      <text x="598" y="610" fill="#fcd34d" font-family="JetBrains Mono, Menlo, Consolas, monospace">exec: js → node</text>
    </g>
    <g>
      <rect x="850" y="540" width="310" height="96" rx="12" fill="#0f1626" stroke="#5b6b85" stroke-width="1.3"/>
      <use href="#i-sliders" xlink:href="#i-sliders" x="866" y="552" width="20" height="20" color="#8f8ff2"/>
      <text x="894" y="567" fill="#f1f5f9" font-weight="700" font-size="12">config/</text>
      <text x="868" y="590" fill="#7d8aa0">modules.json · history.json</text>
      <text x="868" y="610" fill="#8f8ff2" font-family="JetBrains Mono, Menlo, Consolas, monospace">overlay + recent</text>
    </g>
  </g>

  <!-- runtime -> data arrows -->
  <g stroke="#8f8ff2" stroke-width="1.8">
    <line x1="300" y1="502" x2="200" y2="536" marker-end="url(#arr)" stroke-dasharray="7 6">
      <animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="502" x2="470" y2="536" marker-end="url(#arr)" stroke-dasharray="7 6">
      <animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="760" y1="502" x2="700" y2="536" marker-end="url(#arr)" stroke-dasharray="7 6">
      <animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" begin="0.7s" repeatCount="indefinite"/>
    </line>
  </g>
  <text x="600" y="524" text-anchor="middle" fill="#8f8ff2" font-size="10.5" font-style="italic">reads manifest · runs impl</text>
  <line x1="1005" y1="538" x2="900" y2="504" stroke="#5b6b85" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrD)">
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.1s" begin="0.4s" repeatCount="indefinite"/>
  </line>

  <!-- footer -->
  <text x="600" y="676" text-anchor="middle" fill="#475569" font-size="11" letter-spacing="1">solid = calls · dashed = reads · ★ = primary path</text>
  <text x="600" y="698" text-anchor="middle" fill="#475569" font-size="10.5">static link (C++) · in-process (Rust bin) · import (Python dev path)</text>
</svg>
