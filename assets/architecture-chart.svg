  <rect x="4" y="4" width="1192" height="712" rx="22" fill="url(#cbg)" stroke="#26334d" stroke-width="1.5"/>
  <rect x="4" y="4" width="1192" height="712" rx="22" fill="url(#cdots)" opacity="0.45"/>
  <rect x="4" y="4" width="1192" height="712" rx="22" fill="url(#cvig)"/>

  <text x="600" y="42" text-anchor="middle" fill="#5b6b85" font-size="11" letter-spacing="5">RPLKIT · ARCHITECTURE CHART</text>
  <text x="600" y="68" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="800">Data Flow: Entry → Runtime → Tools</text>

  <!-- ============ ROW 1: ENTRY ============ -->
  <g font-size="12">
    <g>
      <rect x="40" y="96" width="340" height="66" rx="12" fill="#0b1428" stroke="#38bdf8" stroke-width="1.4"/>
      <use href="#i-term" xlink:href="#i-term" x="58" y="108" width="24" height="24" color="#38bdf8"/>
      <text x="90" y="122" fill="#f1f5f9" font-weight="700">C++ rplkit</text>
      <text x="90" y="142" fill="#7d8aa0" font-size="11">CLI + menu · delegates TUI · FFI bridge</text>
    </g>
    <g>
      <rect x="420" y="96" width="360" height="66" rx="12" fill="#0b1428" fill-opacity="0.9" stroke="url(#cedge)" stroke-width="1.6"/>
      <use href="#i-bolt" xlink:href="#i-bolt" x="438" y="108" width="24" height="24" color="#e6b34d"/>
      <text x="470" y="122" fill="#f1f5f9" font-weight="700">Rust rplkit <tspan fill="#8f8ff2" font-size="10">★ primary</tspan></text>
      <text x="470" y="142" fill="#7d8aa0" font-size="11">CLI · TUI (tty) · module cmds · history</text>
    </g>
    <g>
      <rect x="820" y="96" width="340" height="66" rx="12" fill="#0b1428" stroke="#e6b34d" stroke-width="1.4"/>
      <use href="#i-doc" xlink:href="#i-doc" x="838" y="108" width="24" height="24" color="#e6b34d"/>
      <text x="870" y="122" fill="#f1f5f9" font-weight="700">python main.py</text>
      <text x="870" y="142" fill="#7d8aa0" font-size="11">dev path · no build · imports impl.py</text>
    </g>
  </g>

  <!-- entry -> runtime/data arrows -->
  <line x1="210" y1="162" x2="480" y2="196" stroke="#8f8ff2" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="7 6">
    <animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <text x="300" y="192" fill="#8f8ff2" font-size="10.5" font-style="italic">FFI · static link</text>
  <line x1="600" y1="162" x2="600" y2="196" stroke="#8f8ff2" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="7 6">
    <animate attributeName="stroke-dashoffset" from="13" to="0" dur="0.9s" begin="0.2s" repeatCount="indefinite"/>
  </line>
  <text x="612" y="188" fill="#8f8ff2" font-size="10.5" font-style="italic">in-process</text>
  <line x1="840" y1="162" x2="840" y2="536" stroke="#5b6b85" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrD)">
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <text transform="rotate(-90 832 350)" x="832" y="350" text-anchor="middle" fill="#5b6b85" font-size="10.5" font-style="italic">imports impl.py</text>

  <!-- ============ ROW 2 ============ -->
  <!-- rplkit-core -->
  <g>
    <rect x="40" y="206" width="300" height="296" rx="14" fill="#0b1226" fill-opacity="0.94" stroke="#38bdf8" stroke-width="1.4"/>
    <use href="#i-hex" xlink:href="#i-hex" x="58" y="218" width="22" height="22" color="#38bdf8"/>
    <text x="88" y="235" fill="#f1f5f9" font-size="13" font-weight="700">rplkit-core</text>
    <text x="60" y="256" fill="#5b6b85" font-size="10.5">safe primitives · motives</text>
    <g font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7dd3fc">
      <text x="60" y="284">calc · codec</text>
      <text x="60" y="306">uuid · timestamp</text>
      <text x="60" y="328">sys · sysinfo</text>
      <text x="60" y="350">manifests · json</text>
      <text x="60" y="372">file-info · convert</text>
